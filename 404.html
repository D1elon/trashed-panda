<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aisle not found · Trashed Panda</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    .lost { min-height: calc(100vh - var(--nav-h)); display: grid; place-items: center; padding: 48px 16px; text-align: center; }
    .lost img { width: 292px; height: auto; margin: 0 auto 28px; } /* 4x the 73px art */
    .lost h1 { font-size: 20px; margin-bottom: 14px; color: var(--amber-hi); text-shadow: 3px 3px 0 var(--amber-lo); }
    .lost p { color: var(--cream-2); max-width: 36ch; margin: 0 auto 26px; }
    .lost .row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header class="nav">
    <a class="nav__brand" href="/"><img src="/assets/ui/raccoon-face.png" width="18" height="21" alt="" /><span>Trashed Panda</span></a>
    <nav class="nav__links" aria-label="Main"><a href="/play/">Play</a><a href="/shop/">Shop</a></nav>
  </header>
  <main class="lost">
    <div>
      <img src="/assets/shop/print-sticker-passed-out.png" width="146" height="64" alt="A raccoon passed out on its back" />
      <h1>This aisle is empty</h1>
      <p>Whatever was here got knocked off the shelf. Probably by a raccoon.</p>
      <div class="row">
        <a class="btn btn--primary btn--lg" href="/play/">Play the game</a>
        <a class="btn btn--holiday btn--lg" href="/shop/">Visit the shop</a>
      </div>
    </div>
  </main>
</body>
</html>
